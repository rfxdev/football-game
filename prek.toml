default_install_hook_types = ["pre-commit", "commit-msg"]
# Otherwise every file hook also runs on the commit message file
default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  # Linux is case-sensitive, so a path that works on the dev machine can fail on the Deck.
  # Fails any path with a capital or a space; docs keep their conventional names
  { id = "deny-filename-pattern", name = "lowercase paths", args = ["."], files = '[A-Z ]', exclude = '\.md$|^LICENSE$' },
  { id = "check-case-conflict" },
  # Public repo: removing a committed file means rewriting history
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
  { id = "check-merge-conflict" },
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
  { id = "end-of-file-fixer" },
]

[[repos]]
repo = "https://github.com/Scony/godot-gdscript-toolkit"
rev = "4.5.0"
hooks = [
  # Newest Python has no prebuilt pyyaml wheel on Windows yet
  { id = "gdformat", language_version = "python3.13" },
  { id = "gdlint", language_version = "python3.13" },
]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [
  { id = "conventional-pre-commit" },
]
